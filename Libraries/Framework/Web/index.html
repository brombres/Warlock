<!doctype html>
<!--
  Emscripten shell page for the Warlock Web build.

  Copied from Libraries/Warlock/Libraries/Framework/Web/index.html into
  Platforms/Web/ - yours to modify; 'rogo deps' will not overwrite it.
  Emscripten replaces {{{ SCRIPT }}} with the <script> tag that loads the app.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Warlock App</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    /* Black loading screen with a minimal progress bar, shown until the app starts. */
    #loader {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.25s ease-out;
    }
    #loader.done {
      opacity: 0;
      pointer-events: none;
    }
    #loader-bar {
      width: min(320px, 60vw);
      height: 8px;
      border: 1px solid #fff;
      box-sizing: border-box;
    }
    #loader-fill {
      width: 0%;
      height: 100%;
      background: #fff;
      transition: width 0.1s linear;
    }
    #loader-fill.complete {
      width: 100%;
      transition: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="loader"><div id="loader-bar"><div id="loader-fill"></div></div></div>
  <script>
    // ---- Loading progress ---------------------------------------------------
    // The Makefile replaces __WARLOCK_TOTAL_BYTES__ after linking with the
    // combined size of index.wasm + index.data. Byte-accurate progress is shown
    // whenever the downloads report it; otherwise progress is estimated from
    // elapsed time, assuming a typical home wifi connection.
    //
    // Lifecycle: downloads -> runtime initialized (finish(): bar reaches 100%)
    // -> the app's synchronous startup blocks the main thread while it decodes
    // assets -> Warlock.cpp calls Module.onFirstFrame() after the first frame
    // -> reveal(): the bar is displayed at 100% for 'completeHoldMs', then the
    // loading screen fades out over 'fadeMs' to show the game.
    var Loader = {
      totalBytes: Number( "__WARLOCK_TOTAL_BYTES__" ) || 0,
      assumedBytesPerSecond: 6 * 1024 * 1024,   // ~50 Mbps
      completeHoldMs: 250,   // how long the finished bar stays on screen
      fadeMs: 250,           // must match the #loader opacity transition
      revealTimeoutMs: 10000, // reveal anyway if the app never reports a first frame
      startTime: performance.now(),
      wasm: { loaded: 0, total: 0 },
      data: { loaded: 0, total: 0 },
      shown: 0,
      finished: false,
      revealed: false,

      fraction: function() {
        var loaded = this.wasm.loaded + this.data.loaded;
        var total  = this.totalBytes || (this.wasm.total + this.data.total);
        if (loaded > 0 && total > 0) return Math.min( loaded / total, 1 );

        // No byte counts (yet): estimate from time. Never reaches 100% on its own.
        var expectedSeconds = (this.totalBytes || 64 * 1024 * 1024) / this.assumedBytesPerSecond;
        var elapsed = (performance.now() - this.startTime) / 1000;
        return Math.min( elapsed / expectedSeconds, 0.95 );
      },

      update: function() {
        if (this.finished) return;
        this.shown = Math.max( this.shown, this.fraction() );   // never move backwards
        document.getElementById( 'loader-fill' ).style.width = (this.shown * 100) + '%';
        requestAnimationFrame( function() { Loader.update(); } );
      },

      // Called when the runtime is initialized: all downloads are complete.
      finish: function() {
        if (this.finished) return;
        this.finished = true;
        document.getElementById( 'loader-fill' ).classList.add( 'complete' );
        setTimeout( function() { Loader.reveal(); }, this.revealTimeoutMs );
      },

      // Called after the app has drawn its first frame: hold the completed bar
      // briefly, then fade the loading screen out to reveal the game.
      reveal: function() {
        if (this.revealed) return;
        this.revealed = true;
        this.finish();
        var loader = document.getElementById( 'loader' );
        requestAnimationFrame( function() {   // wait for the 100% bar to be painted
          setTimeout( function() {
            loader.classList.add( 'done' );
            setTimeout( function() { loader.remove(); }, Loader.fadeMs + 50 );
          }, Loader.completeHoldMs );
        });
      },

      // Fetches 'url', accumulating progress into 'stats'; resolves to an ArrayBuffer.
      fetchWithProgress: function( url, stats ) {
        return fetch( url ).then( function( response ) {
          if (!response.ok) throw new Error( "Failed to fetch " + url + ": " + response.status );
          stats.total = Number( response.headers.get('Content-Length') ) || 0;
          if (!response.body) return response.arrayBuffer();

          var reader = response.body.getReader();
          var chunks = [];
          return reader.read().then( function step( result ) {
            if (result.done) {
              var buffer = new Uint8Array( stats.loaded );
              var offset = 0;
              chunks.forEach( function( chunk ) { buffer.set( chunk, offset ); offset += chunk.length; } );
              return buffer.buffer;
            }
            chunks.push( result.value );
            stats.loaded += result.value.length;
            return reader.read().then( step );
          });
        });
      }
    };

    var Module = {
      canvas: document.getElementById( 'canvas' ),
      print:    function( text ) { console.log( text ); },
      printErr: function( text ) { console.error( text ); },

      // Emscripten reports asset package download progress as
      // "Downloading data... (loaded/total)".
      setStatus: function( text ) {
        var m = /\((\d+)\/(\d+)\)/.exec( text );
        if (m) { Loader.data.loaded = Number( m[1] ); Loader.data.total = Number( m[2] ); }
      },

      // Fetch the .wasm ourselves so its download counts toward the progress bar.
      instantiateWasm: function( imports, onSuccess ) {
        Loader.fetchWithProgress( 'index.wasm', Loader.wasm )
          .then( function( bytes )  { return WebAssembly.instantiate( bytes, imports ); } )
          .then( function( result ) { onSuccess( result.instance, result.module ); } )
          .catch( function( err )   { console.error( err ); Module.printErr( "Failed to load index.wasm" ); } );
        return {};
      },

      onRuntimeInitialized: function() { Loader.finish(); },
      onFirstFrame:         function() { Loader.reveal(); }   // called from Warlock.cpp
    };

    Loader.update();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
