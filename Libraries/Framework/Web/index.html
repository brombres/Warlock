<!doctype html>
<!--
  Emscripten shell page for the Warlock Web build.

  Copied from Libraries/Warlock/Libraries/Framework/Web/index.html into
  Platforms/Web/ - yours to modify; 'rogo deps' will not overwrite it.
  Emscripten replaces {{{ SCRIPT }}} with the <script> tag that loads the app.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Warlock App</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    /* Black loading screen with a minimal progress bar, shown until the app starts. */
    #loader {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.25s ease-out;
    }
    #loader.done {
      opacity: 0;
      pointer-events: none;
    }
    #loader-bar {
      width: min(320px, 60vw);
      height: 8px;
      border: 1px solid #fff;
      box-sizing: border-box;
    }
    /* The fill is animated with 'transform' rather than 'width' so that the
       browser's compositor thread can keep animating it while the main thread
       is blocked by the app's startup (see Loader.launch below). */
    #loader-fill {
      width: 100%;
      height: 100%;
      background: #fff;
      transform: scaleX(0);
      transform-origin: 0 50%;
      will-change: transform;
      transition: transform 0.1s linear;
    }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="loader"><div id="loader-bar"><div id="loader-fill"></div></div></div>
  <script>
    // ---- Loading progress ---------------------------------------------------
    // The bar covers two phases:
    //
    // 1. Download (byte-accurate). The Makefile replaces __WARLOCK_TOTAL_BYTES__
    //    after linking with the combined size of index.wasm + index.data. If
    //    the downloads report no byte counts, progress is estimated from
    //    elapsed time, assuming a typical home wifi connection.
    //
    // 2. Startup (time-estimated). Once the runtime is initialized, main() runs
    //    the app's synchronous startup - decoding textures and other assets -
    //    which blocks the main thread, so no script can update the bar. Instead,
    //    a CSS transform transition is started just before main() is called; the
    //    compositor thread keeps animating it while the main thread is blocked.
    //    Its duration comes from the startup time measured on the previous load
    //    (kept in localStorage and updated after every load, so it tracks changes
    //    to the app), or a default guess on the first load.
    //
    // The two phases share the bar in proportion to their expected durations.
    // When Warlock.cpp reports the first frame via Module.onFirstFrame(), the
    // bar snaps to 100%, holds for 'completeHoldMs', then the loading screen
    // fades out to reveal the game.
    var Loader = {
      totalBytes: Number( "__WARLOCK_TOTAL_BYTES__" ) || 0,
      assumedBytesPerSecond: 6 * 1024 * 1024,   // ~50 Mbps; used only when no byte counts arrive
      defaultStartupMs: 2000,   // startup estimate for a first-ever load
      startupOverrunFactor: 1.2,  // animate a bit slower than the estimate so the bar rarely hits 100% early
      completeHoldMs: 250,   // how long the finished bar stays on screen
      fadeMs: 250,           // must match the #loader opacity transition
      revealTimeoutMs: 10000, // reveal anyway if the app never reports a first frame
      storageKey: 'warlock.loader',

      startTime: performance.now(),
      wasm: { loaded: 0, total: 0 },
      data: { loaded: 0, total: 0 },
      shown: 0,
      finished: false,
      launchTime: 0,
      revealed: false,

      // Startup time measured on the previous load, or the default.
      estimatedStartupMs: function() {
        try {
          var saved = JSON.parse( localStorage.getItem(this.storageKey) || '{}' );
          if (saved.startupMs > 0) return saved.startupMs;
        } catch (e) {}
        return this.defaultStartupMs;
      },

      saveStartupMs: function( ms ) {
        try { localStorage.setItem( this.storageKey, JSON.stringify({ startupMs: Math.round(ms) }) ); } catch (e) {}
      },

      // Fraction of the download completed, 0..1.
      downloadFraction: function() {
        var loaded = this.wasm.loaded + this.data.loaded;
        var total  = this.totalBytes || (this.wasm.total + this.data.total);
        if (loaded > 0 && total > 0) return Math.min( loaded / total, 1 );

        // No byte counts (yet): estimate from time. Never reaches 100% on its own.
        var expectedSeconds = (this.totalBytes || 64 * 1024 * 1024) / this.assumedBytesPerSecond;
        var elapsed = (performance.now() - this.startTime) / 1000;
        return Math.min( elapsed / expectedSeconds, 0.95 );
      },

      // Overall fraction during the download phase. The download's share of the
      // bar is its projected duration (from the rate so far) relative to the
      // projected duration of download + startup.
      fraction: function() {
        var f = this.downloadFraction();
        if (f <= 0) return 0;
        var elapsed = performance.now() - this.startTime;
        var projectedDownloadMs = elapsed / f;
        var share = projectedDownloadMs / (projectedDownloadMs + this.estimatedStartupMs());
        return f * share;
      },

      setFill: function( fraction, transition ) {
        var fill = document.getElementById( 'loader-fill' );
        fill.style.transition = transition;
        fill.style.transform = 'scaleX(' + fraction + ')';
      },

      update: function() {
        if (this.finished) return;
        this.shown = Math.max( this.shown, this.fraction() );   // never move backwards
        this.setFill( this.shown, 'transform 0.1s linear' );
        requestAnimationFrame( function() { Loader.update(); } );
      },

      // Called when the runtime is initialized (downloads complete) and main()
      // is waiting to be run. Starts the compositor-driven startup animation,
      // waits for it to be committed to the compositor, then runs main().
      launch: function() {
        if (this.finished) return;
        this.finished = true;
        var durationMs = this.estimatedStartupMs() * this.startupOverrunFactor;
        this.setFill( 1, 'transform ' + Math.round(durationMs) + 'ms ease-out' );
        setTimeout( function() { Loader.reveal(); }, this.revealTimeoutMs );

        // Two frames: the first commits the transition's starting state, the
        // second guarantees the compositor has picked up the animation.
        requestAnimationFrame( function() {
          requestAnimationFrame( function() {
            Loader.launchTime = performance.now();
            Module.callMain();
          });
        });
      },

      // Called after the app has drawn its first frame: record the measured
      // startup time, hold the completed bar briefly, then fade the loading
      // screen out to reveal the game.
      reveal: function() {
        if (this.revealed) return;
        this.revealed = true;
        if (this.launchTime) this.saveStartupMs( performance.now() - this.launchTime );

        this.setFill( 1, 'none' );
        var loader = document.getElementById( 'loader' );
        requestAnimationFrame( function() {   // wait for the 100% bar to be painted
          setTimeout( function() {
            loader.classList.add( 'done' );
            setTimeout( function() { loader.remove(); }, Loader.fadeMs + 50 );
          }, Loader.completeHoldMs );
        });
      },

      // Fetches 'url', accumulating progress into 'stats'; resolves to an ArrayBuffer.
      fetchWithProgress: function( url, stats ) {
        return fetch( url ).then( function( response ) {
          if (!response.ok) throw new Error( "Failed to fetch " + url + ": " + response.status );
          stats.total = Number( response.headers.get('Content-Length') ) || 0;
          if (!response.body) return response.arrayBuffer();

          var reader = response.body.getReader();
          var chunks = [];
          return reader.read().then( function step( result ) {
            if (result.done) {
              var buffer = new Uint8Array( stats.loaded );
              var offset = 0;
              chunks.forEach( function( chunk ) { buffer.set( chunk, offset ); offset += chunk.length; } );
              return buffer.buffer;
            }
            chunks.push( result.value );
            stats.loaded += result.value.length;
            return reader.read().then( step );
          });
        });
      }
    };

    var Module = {
      canvas: document.getElementById( 'canvas' ),
      print:    function( text ) { console.log( text ); },
      printErr: function( text ) { console.error( text ); },

      // Emscripten reports asset package download progress as
      // "Downloading data... (loaded/total)".
      setStatus: function( text ) {
        var m = /\((\d+)\/(\d+)\)/.exec( text );
        if (m) { Loader.data.loaded = Number( m[1] ); Loader.data.total = Number( m[2] ); }
      },

      // Fetch the .wasm ourselves so its download counts toward the progress bar.
      instantiateWasm: function( imports, onSuccess ) {
        Loader.fetchWithProgress( 'index.wasm', Loader.wasm )
          .then( function( bytes )  { return WebAssembly.instantiate( bytes, imports ); } )
          .then( function( result ) { onSuccess( result.instance, result.module ); } )
          .catch( function( err )   { console.error( err ); Module.printErr( "Failed to load index.wasm" ); } );
        return {};
      },

      // main() is run by Loader.launch() rather than automatically, so the
      // startup animation can be handed to the compositor first.
      // (Requires -sEXPORTED_RUNTIME_METHODS=callMain in the Makefile.)
      noInitialRun: true,
      onRuntimeInitialized: function() { Loader.launch(); },
      onFirstFrame:         function() { Loader.reveal(); }   // called from Warlock.cpp
    };

    Loader.update();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
